<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Balance Botanica golden paste jar placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF6E3"/>
      <stop offset="1" stop-color="#F5E6C4"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E07B12"/>
      <stop offset="1" stop-color="#A85408"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3F6F68"/>
      <stop offset="1" stop-color="#2D5A54"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="215" fill="#FFFFFF" opacity="0.55"/>
  <!-- spoon -->
  <g transform="rotate(24 430 200)">
    <rect x="422" y="120" width="16" height="180" rx="8" fill="#B08968"/>
    <ellipse cx="430" cy="320" rx="34" ry="26" fill="#E07B12"/>
    <ellipse cx="430" cy="316" rx="26" ry="19" fill="#F09A2E"/>
  </g>
  <!-- jar -->
  <rect x="170" y="200" width="220" height="44" rx="12" fill="url(#lid)"/>
  <rect x="170" y="236" width="220" height="190" rx="26" fill="url(#jar)"/>
  <rect x="170" y="236" width="220" height="190" rx="26" fill="#FFFFFF" opacity="0.08"/>
  <!-- label -->
  <rect x="188" y="272" width="184" height="118" rx="14" fill="#FFFDF6"/>
  <!-- paw -->
  <g fill="#3F6F68">
    <ellipse cx="280" cy="330" rx="26" ry="21"/>
    <circle cx="248" cy="300" r="9"/>
    <circle cx="266" cy="290" r="9"/>
    <circle cx="286" cy="290" r="9"/>
    <circle cx="304" cy="300" r="9"/>
  </g>
  <text x="280" y="372" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="bold" fill="#3F6F68">BALANCE BOTANICA</text>
  <text x="280" y="452" text-anchor="middle" font-family="Verdana, sans-serif" font-size="22" font-weight="bold" fill="#7A4A12">GOLDEN PASTE 95%</text>
  <text x="280" y="478" text-anchor="middle" font-family="Verdana, sans-serif" font-size="14" fill="#7A4A12">turmeric • ginger • pepper</text>
  <text x="280" y="560" text-anchor="middle" font-family="Verdana, sans-serif" font-size="12" fill="#A08C6A">real jar photo coming soon</text>
</svg>
